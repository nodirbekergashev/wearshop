<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POW Store - Asosiy sahifa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <h2 class="fw-bolder mb-4">Featured Products</h2>
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">

            <div class="col mb-5" th:each="product : ${products}">
                <div class="card h-100">
                    <img class="card-img-top" th:src="${product.firstImageUrl}" alt="..." />
                    <div class="card-body p-4">
                        <div class="text-center">
                            <h5 class="fw-bolder" th:text="${product.name}">Product Name</h5>
                            <span th:text="${product.price.price} + ' ' + ${product.price.currency}">$40.00</span>
                        </div>
                    </div>

                    <div class="card-body px-0">
                        <h5 class="card-title text-uppercase fw-bold fs-6" th:text="${product.name}">
                            Product Name
                        </h5>

                        <p class="card-text text-muted" th:text="${product.getPrice().getPrice() + ' ' + product.getPrice().getCurrency()}">
                            0.00 USD
                        </p>

                        <a th:href="@{/product/{id}(id=${product.id})}" class="stretched-link"></a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
