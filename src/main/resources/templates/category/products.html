<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.name} + ' - Power of Wear'">Category Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Header -->
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder" th:text="${category.name}">Category Name</h1>
                <p class="lead fw-normal text-white-50 mb-0" th:text="${category.description}">Category Description</p>
            </div>
        </div>
    </header>

    <!-- Section-->
    <section class="py-5">
        <div class="container px-4 px-lg-5 mt-5">
            <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">

                <div class="col mb-5" th:each="product : ${products}">
                    <div class="card h-100">
                        <!-- Product image-->
                        <img class="card-img-top" th:src="${product.firstImageUrl}" alt="..." />
                        <!-- Product details-->
                        <div class="card-body p-4">
                            <div class="text-center">
                                <!-- Product name-->
                                <h5 class="fw-bolder" th:text="${product.name}">Fancy Product</h5>
                                <!-- Product price-->
                                <span th:text="${product.price.price} + ' ' + ${product.price.currency}">$40.00 - $80.00</span>
                            </div>
                        </div>
                        <!-- Product actions-->
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <div class="text-center"><a class="btn btn-outline-dark mt-auto" th:href="@{/products/{id}(id=${product.id})}">View options</a></div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Pagination (Simple Example) -->
            <nav aria-label="Page navigation example" th:if="${products.totalPages > 1}">
              <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                  <a class="page-link" th:href="@{/categories/{id}(id=${category.id}, page=${products.number - 1})}" tabindex="-1">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${products.number == i} ? 'active'">
                    <a class="page-link" th:href="@{/categories/{id}(id=${category.id}, page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                  <a class="page-link" th:href="@{/categories/{id}(id=${category.id}, page=${products.number + 1})}">Next</a>
                </li>
              </ul>
            </nav>

        </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 bg-dark">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Power of Wear 2025</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
