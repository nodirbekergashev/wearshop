<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/
    css/navbar-styles.css}" />
</head>
<body>

<header th:fragment="mainHeader" class="border-bottom bg-white py-3">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-4 d-md-none">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                    <i class="bi bi-list fs-2"></i>
                </button>
            </div>

            <div class="col-4 col-md-12 text-center mb-md-3">
                <a th:href="@{/}">
                    <img th:src="@{/images/brand-logo.png}" alt="W" style="max-height: 70px; width: auto;">
                </a>
            </div>

            <div class="col-4 col-md-12 d-flex justify-content-end justify-content-md-end position-absolute end-0 px-4">
                <div class="d-flex gap-3 align-items-center">
                    <a th:href="@{/auth/login}" class="text-dark text-decoration-none d-none d-md-block">
                        <i class="bi bi-person fs-4"></i>
                    </a>
                    <a th:href="@{/cart}" class="text-dark text-decoration-none position-relative">
                        <i class="bi bi-cart3 fs-4"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark"
                              th:text="${cartCount}">0</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="collapse d-md-block mt-2" id="navContent">
            <ul class="nav justify-content-center text-uppercase fw-bold" style="letter-spacing: 1.5px; font-size: 0.9rem;">
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" th:href="@{/category/hoodies}">Hoodies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" th:href="@{/category/sweatpants}">Sweatpants</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" th:href="@{/shop-all}">Shop All</a>
                </li>
            </ul>
        </div>
    </div>
</header>

</body>
</html>
