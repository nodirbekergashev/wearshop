<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Power of Wear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth-styles.css}">


</head>
<body>

<div class="container">
    <div class="auth-card">
        <a href="/" class="brand-logo">POWER OF WEAR</a>

        <h2 class="fw-bold mb-1">KIRISH</h2>
        <p class="text-muted small mb-4">Davom etish uchun tizimga kiring</p>

        <form th:action="@{/auth/login}" th:object="${user}" method="post">
            <div class="mb-3">
                <label class="form-label">Telefon raqam</label>
                <input type="tel" id="loginPhone" th:field="*{phoneNumber}" class="form-control" placeholder="(90) 000-00-00" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Parol</label>
                <div class="input-group">
                    <input type="password" id="loginPass" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                    <span class="input-group-text" onclick="togglePass()">
                        <i id="eyeIcon" class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input border-dark rounded-0" type="checkbox" id="remember">
                    <label class="form-check-label small" for="remember">Eslab qolish</label>
                </div>
                <a th:href="@{/auth/forgot-password}" class="auth-link">Parol esdan chiqdimi?</a>
            </div>

            <button type="submit" class="btn btn-auth mb-3">Kirish</button>

            <div class="auth-divider">
                <span>Yoki</span>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-6">
                    <button type="button" class="btn btn-social"><i class="fab fa-google me-2"></i>Google</button>
                </div>
                <div class="col-6">
                    <button type="button" class="btn btn-social"><i class="fab fa-facebook me-2"></i>Facebook</button>
                </div>
            </div>

            <div th:if="${errorMessage}" class="custom-alert alert-dismissible fade show" role="alert">
                <i class="fas fa-info-circle me-3"></i>
                <span th:text="${errorMessage}">Xatolik xabari bu yerda chiqadi</span>
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert"></button>
            </div>

            <div class="text-center">
                <span class="small text-muted">Akkauntingiz yo'qmi?</span>
                <a th:href="@{/auth/register}" class="auth-link ms-1">Ro'yxatdan o'tish</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Parol ko'rinishini almashtirish
    function togglePass() {
        const passField = document.getElementById('loginPass');
        const icon = document.getElementById('eyeIcon');
        if (passField.type === "password") {
            passField.type = "text";
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passField.type = "password";
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    document.getElementById('loginPhone').addEventListener('input', function (e) {
        let val = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2})/);
        e.target.value = !val[2] ? val[1] : '(' + val[1] + ') ' + val[2] + (val[3] ? '-' + val[3] : '') + (val[4] ? '-' + val[4] : '');
    });
</script>

</body>
</html>
