spring:
  application:
    name: EcommerceApplication

  datasource:
    url: jdbc:postgresql://localhost:5432/shop_db

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  upload:
    dir: /home/nodirbek/IdeaProjects/project_photos/products
    max-size-mb: 5
    allowed-types: image/jpeg,image/png,image/webp,image/jpg

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.hbm2ddl: DEBUG
server:
  port: 8080